services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_app
      POSTGRES_PASSWORD: salary_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_app -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/salary_management
      DB_USER: salary_app
      DB_PASSWORD: salary_app
      SEED_ON_STARTUP: "true"
      SEED_EMPLOYEE_COUNT: "10000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
