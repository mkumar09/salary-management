spring:
  application:
    name: salary-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${DB_USER:salary_app}
    password: ${DB_PASSWORD:salary_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  seed:
    enabled: ${SEED_ON_STARTUP:false}
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
    random-seed: ${SEED_RANDOM_SEED:42}
